[package]
name = "mitos-pkg"
version = "0.2.0"
edition = "2021"
authors = ["Shark <babor3331@gmail.com>"]
description = "The official package manager for MITOS"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
tar = "0.4"
flate2 = "1"
semver = { version = "1", features = ["serde"] }

# Blocking HTTP client. Chosen over reqwest/hyper deliberately: those pull
# in an async runtime (tokio) whose thread pool and I/O driver cost real
# memory even for a tool that only ever does one download at a time.
ureq = "3"

[profile.release]
# Optimize the shipped binary for size and lean runtime footprint rather
# than raw speed — mitos-pkg spends almost all its time on I/O (network,
# disk), not CPU, so codegen-units=1 + opt-level="s" barely costs latency
# while noticeably shrinking the binary MITOS has to keep resident.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
